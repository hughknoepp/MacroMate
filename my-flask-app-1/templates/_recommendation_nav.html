{# Switch between the nutrient pages. Pass `current` as 'protein' or 'carbs'. #}
<nav class="rec-nav" aria-label="Nutrient recommendations">
    {% for key, label, endpoint in [('protein', 'Protein', 'protein_recommendations'), ('carbs', 'Carbs', 'carbs_recommendations')] %}
    <a href="{{ url_for(endpoint) }}"{% if key == current %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
</nav>
